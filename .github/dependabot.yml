version: 2
updates:
  # Enable version updates for Ruby
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "merouaneamqor"
    assignees:
      - "merouaneamqor"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "merouaneamqor"
    assignees:
      - "merouaneamqor"
    commit-message:
      prefix: "ci"
      include: "scope"
